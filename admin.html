<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const U='https://zlexolhjqdbdhdduglox.supabase.co',K='sb_publishable_O93NmDuscyE6OqUKd9epOw_nCMuYrYW',BUCKET='product-images';
const sb=window.supabase.createClient(U,K,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storage:window.localStorage}});
let token='',categories=[],products=[],images=[],currentCategory=null,lastView='dashboard',dragId=null;
async function syncToken(){const {data,error}=await sb.auth.getSession();if(error)throw error;token=data.session?.access_token||'';return data.session}
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function msg(id,t,e=false){$(id).innerHTML=t?`<div class="msg ${e?'error':''}">${esc(t)}</div>`:''}
function showSaveSuccess(title='تمت الإضافة بنجاح',sub=''){
 $('saveSuccessTitle').textContent=title;$('saveSuccessSub').textContent=sub;
 const el=$('saveSuccess');el.classList.add('show');
 clearTimeout(showSaveSuccess.timer);
 showSaveSuccess.timer=setTimeout(()=>el.classList.remove('show'),1500);
}
async function api(path,opt={}){await syncToken();opt.headers={apikey:K,Authorization:'Bearer '+token,...(opt.headers||{})};const r=await fetch(U+path,opt);if(!r.ok)throw Error(await r.text());if(r.status===204)return null;const txt=await r.text();return txt?JSON.parse(txt):null}
async function login(){try{msg('loginMsg','');const {data,error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)throw error;token=data.session?.access_token||'';start()}catch(e){msg('loginMsg','بيانات الدخول غير صحيحة',true)}}
async function logout(){await sb.auth.signOut();token='';location.reload()}
async function start(){try{const session=await syncToken();if(!session){$('login').classList.remove('hidden');$('app').classList.add('hidden');$('appHeader').classList.add('hidden');return}$('login').classList.add('hidden');$('app').classList.remove('hidden');$('appHeader').classList.remove('hidden');await loadAll()}catch(e){console.error(e);$('login').classList.remove('hidden')}}
async function loadAll(){try{[categories,products,images]=await Promise.all([api('/rest/v1/categories?select=*&order=id.asc'),api('/rest/v1/products?select=*&order=id.desc'),api('/rest/v1/product_images?select=*&order=sort_order.asc')]);renderDashboard();if(currentCategory&&$('categoryView').classList.contains('hidden')===false)openCategory(currentCategory)}catch(e){alert('تعذر تحميل البيانات: '+e.message)}}
function firstImage(id){return images.find(x=>x.product_id==id)?.image_url||''}
function renderDashboard(){$('sCats').textContent=categories.length;$('sProducts').textContent=products.length;$('categories').innerHTML=categories.length?categories.map(c=>{const n=products.filter(p=>p.category_id==c.id).length;return `<div class="card cat" onclick="openCategory(${c.id})">${c.image_url?`<img src="${esc(c.image_url)}">`:`<div class="empty">لا توجد صورة</div>`}<div class="cat-body"><b>${esc(c.name)}</b><small>${n} قطعة</small></div></div>`}).join(''):'<div class="empty">لا توجد أقسام بعد</div>'}
let historyView='dashboard',handlingPop=false;
function show(id,push=true){
 ['dashboard','categoryView','categoryForm','productForm'].forEach(x=>$(x).classList.toggle('hidden',x!==id));
 if(push&&!handlingPop&&id!==historyView){
  history.pushState({adminView:id,category:currentCategory},'',location.href);
 }
 historyView=id;
 window.scrollTo(0,0);
}
function goHome(){currentCategory=null;show('dashboard');renderDashboard()}function goBack(){currentCategory?openCategory(currentCategory):goHome()}
function openCategory(id){currentCategory=Number(id);const c=categories.find(x=>x.id==id);if(!c)return;$('catTitle').textContent=c.name;const list=products.filter(p=>p.category_id==id);$('categoryProducts').innerHTML=list.length?list.map(p=>`<div class="card product" onclick="editProduct(${p.id})">${firstImage(p.id)?`<img src="${esc(firstImage(p.id))}">`:'<div class="empty">بدون صورة</div>'}<div><b>${esc(p.name)}</b><small>${esc(p.code||'')} · ${esc(p.weight||'')}</small></div></div>`).join(''):'<div class="empty">ما في قطع بهذا القسم بعد</div>';show('categoryView')}
function newCategory(){$('catId').value='';$('catName').value='';$('catImage').value='';$('catPreview').innerHTML='';$('catFormTitle').textContent='إضافة قسم جديد';$('deleteCatBtn').classList.add('hidden');msg('catMsg','');lastView=currentCategory?'categoryView':'dashboard';show('categoryForm')}
function editCurrentCategory(){const c=categories.find(x=>x.id==currentCategory);$('catId').value=c.id;$('catName').value=c.name;$('catImage').value='';$('catPreview').innerHTML=c.image_url?`<img src="${esc(c.image_url)}" style="max-width:180px;border-radius:14px;margin-top:10px">`:'';$('catFormTitle').textContent='تعديل القسم';$('deleteCatBtn').classList.remove('hidden');show('categoryForm')}
async function compressImage(file){
 if(!file || !file.type.startsWith('image/')) return file;
 if(file.type==='image/gif' || file.type==='image/svg+xml') return file;
 const MAX=1600, QUALITY=.76;
 let bitmap;
 try{bitmap=await createImageBitmap(file)}catch(e){return file}
 let w=bitmap.width,h=bitmap.height;
 const scale=Math.min(1,MAX/Math.max(w,h));
 w=Math.max(1,Math.round(w*scale)); h=Math.max(1,Math.round(h*scale));
 const canvas=document.createElement('canvas'); canvas.width=w; canvas.height=h;
 const ctx=canvas.getContext('2d',{alpha:false});
 ctx.fillStyle='#fff'; ctx.fillRect(0,0,w,h); ctx.drawImage(bitmap,0,0,w,h);
 if(bitmap.close)bitmap.close();
 const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/jpeg',QUALITY));
 if(!blob || blob.size>=file.size)return file;
 return new File([blob],(file.name.replace(/\.[^.]+$/,'')||'image')+'.jpg',{type:'image/jpeg',lastModified:Date.now()});
}

async function upload(file,path){
 const originalSize=file.size;
 file=await compressImage(file);
 if(file.type==='image/jpeg')path=path.replace(/\.[^.\/]+$/,'.jpg');
 const {data:{session},error:sessionError}=await sb.auth.getSession();
 if(sessionError)throw Error('تشخيص الجلسة: '+sessionError.message);
 if(!session)throw Error('تشخيص الجلسة: لا توجد Session داخل لوحة الأدمن');
 const {data:{user},error:userError}=await sb.auth.getUser();
 if(userError||!user)throw Error('تشخيص المستخدم: '+(userError?.message||'لا يوجد مستخدم'));
 let jwtRole='غير معروف';
 try{jwtRole=JSON.parse(atob(session.access_token.split('.')[1].replace(/-/g,'+').replace(/_/g,'/'))).role||'غير موجود'}catch(e){}
 msg('catMsg','جاري رفع الصورة...');
 const {error}=await sb.storage.from(BUCKET).upload(path,file,{contentType:file.type||'application/octet-stream',upsert:false});
 if(error)throw Error('فشل Storage | JWT role: '+jwtRole+' | '+error.message);
 const {data}=sb.storage.from(BUCKET).getPublicUrl(path);
 return data.publicUrl;
}
async function saveCategory(){try{msg('catMsg','جاري الحفظ...');let id=$('catId').value,name=$('catName').value.trim();if(!name)throw Error('اكتب اسم القسم');let image_url=categories.find(x=>x.id==id)?.image_url||null;const f=$('catImage').files[0];if(f){const ext=(f.name.split('.').pop()||'jpg').replace(/[^a-zA-Z0-9]/g,'');image_url=await upload(f,'categories/'+Date.now()+'-category.'+ext);}let q;if(id){q=sb.from('categories').update({name,image_url}).eq('id',Number(id)).select('id,name,image_url').single()}else{q=sb.from('categories').insert({name,image_url}).select('id,name,image_url').single()}const {data,error}=await q;if(error)throw Error('فشل حفظ القسم: '+error.message);await loadAll();if(!id){goHome();showSaveSuccess('تمت إضافة القسم بنجاح','أصبح القسم جاهزاً لإضافة القطع')}else{msg('catMsg','تم حفظ القسم والصورة ✅');setTimeout(goHome,500)}}catch(e){msg('catMsg',e.message,true)}}
async function deleteCategory(){const id=Number($('catId').value),n=products.filter(p=>p.category_id==id).length;if(n){alert('هذا القسم يحتوي '+n+' قطعة. انقل أو احذف القطع أولاً.');return}if(!confirm('حذف القسم نهائياً؟'))return;try{await api('/rest/v1/categories?id=eq.'+id,{method:'DELETE'});currentCategory=null;await loadAll();goHome()}catch(e){msg('catMsg',e.message,true)}}
function newProduct(cat=null){
 if(cat)currentCategory=Number(cat);
 if(!currentCategory)return;
 const c=categories.find(x=>x.id==currentCategory);
 $('productId').value='';$('pName').value='';$('pWeight').value='';$('pDescription').value='';$('pImages').value='';$('currentImages').innerHTML='';
 $('productFormTitle').textContent='إضافة قطعة';
 $('productCategoryLabel').textContent=c?'قسم '+c.name:'';
 $('deleteProductBtn').classList.add('hidden');msg('productMsg','');show('productForm')
}
function editProduct(id){
 const p=products.find(x=>x.id==id);if(!p)return;
 currentCategory=Number(p.category_id);
 const c=categories.find(x=>x.id==currentCategory);
 $('productId').value=p.id;$('pName').value=p.name||'';$('pWeight').value=p.weight||'';$('pDescription').value=p.description||'';
 $('productCategoryLabel').textContent=c?'قسم '+c.name:'';
 $('productFormTitle').textContent='تعديل '+p.name;$('deleteProductBtn').classList.remove('hidden');$('pImages').value='';renderImages(id);msg('productMsg','');show('productForm')
}
function renderImages(pid){
 const list=images.filter(x=>x.product_id==pid).sort((a,b)=>(a.sort_order||0)-(b.sort_order||0));
 $('currentImages').innerHTML=list.map((x,i)=>`<div class="image-item"><img src="${esc(x.image_url)}">${i===0?'<span class="main-badge">الرئيسية</span>':''}<div class="bar"><button class="danger" onclick="deleteImage(${x.id})">حذف</button></div></div>`).join('')
}
async function deleteImage(id){
 if(!confirm('حذف الصورة؟'))return;
 const img=images.find(x=>x.id==id);
 if(!img)return;
 try{
  let path=null;
  try{
   const u=new URL(img.image_url);
   const marker='/storage/v1/object/public/'+BUCKET+'/';
   const i=u.pathname.indexOf(marker);
   if(i>=0)path=decodeURIComponent(u.pathname.slice(i+marker.length));
  }catch(e){}
  if(path){
   const {error:storageError}=await sb.storage.from(BUCKET).remove([path]);
   if(storageError)throw Error('تعذر حذف ملف الصورة من Storage: '+storageError.message);
  }
  await api('/rest/v1/product_images?id=eq.'+id,{method:'DELETE'});
  images=images.filter(x=>x.id!=id);
  renderImages(Number($('productId').value));
 }catch(e){
  msg('productMsg','فشل حذف الصورة: '+e.message,true);
 }
}
async function addImages(pid,files){
 let n=images.filter(x=>x.product_id==pid).length,added=[];
 for(const f of files){
  n++;
  const ext=(f.name.split('.').pop()||'jpg').replace(/[^a-zA-Z0-9]/g,'');
  const path=pid+'/'+Date.now()+'-'+n+'.'+ext;
  const url=await upload(f,path);
  await api('/rest/v1/product_images',{method:'POST',headers:{'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify({product_id:Number(pid),image_url:url,sort_order:n})});
  added.push({path,url});
 }
 return added;
}
async function saveProduct(){
 let createdPid=null,uploaded=[];
 try{
  msg('productMsg','جاري الحفظ ورفع الصور...');
  const id=$('productId').value;
  const files=[...$('pImages').files];
  const data={name:$('pName').value.trim(),weight:$('pWeight').value.trim(),description:$('pDescription').value.trim(),featured:true,category_id:Number(currentCategory)};
  if(!data.name)throw Error('اكتب اسم القطعة');
  

  let pid;
  if(id){
   await api('/rest/v1/products?id=eq.'+id,{method:'PATCH',headers:{'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify(data)});
   pid=Number(id);
   await addImages(pid,files);
  }else{
   if(!files.length)throw Error('اختر صورة واحدة على الأقل للقطعة');
   const r=await api('/rest/v1/products',{method:'POST',headers:{'Content-Type':'application/json',Prefer:'return=representation'},body:JSON.stringify(data)});
   pid=r[0].id;
   createdPid=pid;
   try{
    uploaded=await addImages(pid,files);
   }catch(uploadError){
    try{await api('/rest/v1/product_images?product_id=eq.'+pid,{method:'DELETE'})}catch(e){}
    for(const x of uploaded){try{await sb.storage.from(BUCKET).remove([x.path])}catch(e){}}
    try{await api('/rest/v1/products?id=eq.'+pid,{method:'DELETE'})}catch(e){}
    createdPid=null;
    throw Error('فشل رفع الصور، لذلك لم يتم حفظ القطعة. '+uploadError.message);
   }
  }

  $('pImages').value='';
  currentCategory=data.category_id;
  await loadAll();
  openCategory(currentCategory);
  if(!id)showSaveSuccess('تمت إضافة القطعة بنجاح','أصبحت القطعة ظاهرة ضمن القسم');
 }catch(e){
  msg('productMsg',e.message,true);
 }
}
async function deleteProduct(){
 const id=Number($('productId').value);
 if(!confirm('حذف القطعة وصورها نهائياً؟'))return;
 const btn=$('deleteProductBtn');
 const oldText=btn.textContent;
 btn.disabled=true;
 btn.textContent='جاري الحذف...';
 msg('productMsg','جاري حذف القطعة وصورها...');
 try{
  const productImages=images.filter(x=>x.product_id==id);
  const paths=productImages.map(x=>{
   try{
    const u=new URL(x.image_url);
    const marker='/storage/v1/object/public/'+BUCKET+'/';
    const i=u.pathname.indexOf(marker);
    return i>=0?decodeURIComponent(u.pathname.slice(i+marker.length)):null;
   }catch(e){return null}
  }).filter(Boolean);

  if(paths.length){
   const {error:storageError}=await sb.storage.from(BUCKET).remove(paths);
   if(storageError)throw Error('تعذر حذف ملفات الصور من Storage: '+storageError.message);
  }

  await api('/rest/v1/product_images?product_id=eq.'+id,{method:'DELETE'});
  await api('/rest/v1/products?id=eq.'+id,{method:'DELETE'});

  products=products.filter(x=>x.id!=id);
  images=images.filter(x=>x.product_id!=id);
  const backCategory=currentCategory;
  renderDashboard();
  if(backCategory)openCategory(backCategory);else goHome();
 }catch(e){
  msg('productMsg','فشل الحذف: '+e.message,true);
  btn.disabled=false;
  btn.textContent=oldText;
 }
}
window.addEventListener('popstate',e=>{
 handlingPop=true;
 const st=e.state||{};
 if(st.category)currentCategory=Number(st.category);
 const view=st.adminView||'dashboard';
 if(view==='categoryView'&&currentCategory)openCategory(currentCategory);
 else if(view==='dashboard')goHome();
 else show(view,false);
 handlingPop=false;
});
history.replaceState({adminView:'dashboard',category:null},'',location.href);

sb.auth.onAuthStateChange((event,session)=>{token=session?.access_token||'';});
start();
</script></body></html>
